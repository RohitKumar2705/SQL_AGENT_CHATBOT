[project]
name = "sql-agent-chatbot"
version = "0.1.0"
description = "A SQL agent chatbot powered by Groq LLM, LangGraph and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "annotated-doc>=0.0.5",
]

[tool.uv]
package = false
